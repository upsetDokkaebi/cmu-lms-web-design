<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/img/cmu-logo-colored-square.png" type="image/x-icon">
    <link rel="stylesheet" href="/dashboard/style.css">
    <link rel="stylesheet" href="/styles/essentials.css">
    <link rel="stylesheet" href="/styles/font.css">
    <title>Dashboard</title>
</head>
<body class="background">
    <nav class="navbar">
        <div class="logo">
            <img src="/img/cmu-logo-colored.png" alt="logo">
            <img src="/img/cmu-logo-text-colored.png" alt="logo-text">
        </div>
        <div class="profile-container">
            <img src="/img/profile-amma.jpg" alt="pf" class="user-img">
            <div class="user-info">
                <p class="display-name">Ammaron Oliveros</p>
                <p class="student-id">202201251</p>
            </div>
        </div>
    </nav>
    <main>
        <nav class="navmenu">
            <button class="menuBtn font-poppins">
                <img src="/img/icon-back.png" class="icon-back">
                <p>Collapse Menu</p>
            </button>
            <ul type="none" class="navigation">
                <li id="announcement"><a href="#"><img src="/img/icon-bell.png" width="20px">Announcement</a></li>
                <li id="dashboard" class="active"><a href="#"><img src="/img/icon-dash.png" width="20px">Dashboard</a></li>
                <li id="courses"><a href="#"><img src="/img/icon-archive.png" width="20px">Courses</a></li>
                <li id="schedule"><a href="#"><img src="/img/icon-calendar.png" width="20px">Schedule</a></li>
                <li id="grades"><a href="#"><img src="/img/icon-grade.png" width="20px">Grades</a></li>
                <li id="facultyEval"><a href="#"><img src="/img/icon-user.png" width="20px">Faculty Evaluation</a></li>
            </ul>
            <button class="logoutBtn font-poppins">
                <img src="/img/icon-logout.png" class="icon-logout">
                <p>Logout Account</p>
            </button>
        </nav>
        <div class="container">
            <div class="content">
                <p>Dashboard</p>
            </div>
        </div>
    </main>
</body>
</html>
